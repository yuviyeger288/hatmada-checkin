# מינימלי בכוונה — רק מה שה-CLI צריך כדי לזהות את התיקייה כפרויקט,
# כדי ש-`supabase functions deploy` לא ייפול על "לא אותחל".

project_id = "hatmada-checkin"

# שער ה-JWT של הפלטפורמה מכובה, והסיבה חשובה: ה-cron קורא לפונקציה עם
# המפתח הסודי של הפרויקט, והמפתחות החדשים של Supabase (sb_secret_…) הם
# לא JWT — השער היה דוחה אותם.
#
# זה לא משאיר את הפונקציה פתוחה: היא בודקת את המפתח בעצמה (allowed()
# ב-index.ts, השוואה בזמן קבוע מול SECRET_KEY) ומחזירה 401 בלעדיו.
[functions.daily-push]
verify_jwt = false
